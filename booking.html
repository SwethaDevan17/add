<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Consultation | HealthSpan Care</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div data-component="header"></div>

    <main>
      <section class="section page-banner fade-in">
        <div class="container">
          <h1>Book a Consultation</h1>
          <p>Tell us what you need and our care team will contact you shortly.</p>
        </div>
      </section>

      <section class="section fade-in">
        <div class="container form-wrap">
          <form class="form card" id="booking-form">
            <label>
              Name
              <input type="text" name="name" required />
            </label>

            <label>
              Age of elder
              <input type="number" name="age" min="40" max="120" required />
            </label>

            <label>
              Phone number
              <input type="tel" name="phone" required />
            </label>

            <label>
              Service required
              <select name="service" required>
                <option value="">Select a service</option>
                <option>Health Monitoring</option>
                <option>Nutrition Support</option>
                <option>Exercise & Physiotherapy</option>
                <option>Medical Care at Home</option>
                <option>Mental & Spiritual Care</option>
              </select>
            </label>

            <label>
              Address (optional)
              <textarea name="address" rows="3"></textarea>
            </label>

            <fieldset>
              <legend>Preferred mode</legend>
              <label class="inline"><input type="radio" name="mode" value="Center Visit" required /> Center Visit</label>
              <label class="inline"><input type="radio" name="mode" value="Home Visit" required /> Home Visit</label>
            </fieldset>

            <button type="submit" class="btn btn-primary">Submit</button>
            <p class="form-message" id="booking-message" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>

    <div data-component="footer"></div>
    <script src="script.js"></script>
  </body>
</html>
